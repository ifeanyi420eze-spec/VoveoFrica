name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: VoveoFrica
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d VoveoFrica"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: test-secret-key-that-is-long-enough-for-tests
      DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/VoveoFrica
      APP_ENV: testing
      SMTP_HOST: smtp.example.test
      SMTP_PORT: "587"
      SMTP_USERNAME: test-user
      SMTP_PASSWORD: test-password
      SMTP_FROM_EMAIL: "VOVEOFRICA <test@example.test>"
      SMTP_USE_TLS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app pkg migrations tests
      - run: flask --app run.py db upgrade
      - run: pytest -q
