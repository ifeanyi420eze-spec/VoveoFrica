name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: VoveoFrica
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: test-secret-key-that-is-long-enough-for-tests
      DATABASE_URL: mysql+pymysql://test:test@127.0.0.1:3306/VoveoFrica
      APP_ENV: testing
      SMTP_HOST: smtp.example.test
      SMTP_PORT: "587"
      SMTP_USERNAME: test-user
      SMTP_PASSWORD: test-password
      SMTP_FROM_EMAIL: "VOVEOFRICA <test@example.test>"
      SMTP_USE_TLS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q pkg migrations tests
      - run: flask --app run.py db upgrade
      - run: pytest -q
