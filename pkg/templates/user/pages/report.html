<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report | VOVEOFRICA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <div class="page-shell">
        <nav class="topbar">
            <a href="{{ url_for('user.dashboard') }}" class="brand" aria-label="VOVEOFRICA dashboard">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
                <span>VOVEOFRICA</span>
            </a>
            <ul class="nav-links">
                <li><a href="{{ url_for('user.discover') }}">Discover</a></li>
                <li><a href="{{ url_for('user.matches') }}">Matches</a></li>
                <li><a href="{{ url_for('root.support') }}" class="active" aria-current="page">Support</a></li>
            </ul>
            <a href="{{ url_for('root.support') }}" class="btn btn-primary small">Customer care</a>
        </nav>

        <main class="report-layout">
            <section class="report-card">
                <p class="eyebrow">Safety and support</p>
                <h1>Report an issue</h1>
                <p class="lede">Tell us what happened with {{ reported_user.first_name }} so we can review it promptly and keep the community safe.</p>

                <form action="{{ url_for('user.report_user', reported_user_id=reported_user.id) }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label for="reason">Issue type</label>
                    <select id="reason" name="reason" required>
                        <option value="">Choose a reason</option>
                        <option value="Harassment">Harassment or unwanted contact</option>
                        <option value="Fake profile">Fake or misleading profile</option>
                        <option value="Inappropriate content">Inappropriate content</option>
                        <option value="Spam">Spam or scam</option>
                        <option value="Other">Other safety concern</option>
                    </select>

                    <label for="details">What happened? <span>(optional)</span></label>
                    <textarea id="details" name="details" rows="6" maxlength="4000" placeholder="Briefly describe what happened..."></textarea>

                    <button type="submit" class="btn btn-primary">Send report</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
