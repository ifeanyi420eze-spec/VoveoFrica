<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>404 Not Found</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem auto;
        max-width: 48rem;
        padding: 0 1rem;
      }
      h1 {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <div
      class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-indigo-100 flex items-center justify-center p-6"
    >
      <div class="w-full max-w-5xl">
        <div
          class="overflow-hidden rounded-[32px] border border-white/70 bg-white/80 shadow-2xl backdrop-blur-xl"
        >
          <div class="grid lg:grid-cols-2 items-center">
            <div class="p-8 sm:p-12 lg:p-14">
              <span
                class="inline-flex items-center rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-indigo-700"
              >
                Error 404
              </span>
              <h1
                class="mt-6 text-6xl font-black leading-none text-slate-900 sm:text-7xl"
              >
                404
              </h1>
              <h2 class="mt-4 text-3xl font-bold text-slate-900">
                Page Not Found
              </h2>
              <p class="mt-4 text-base leading-7 text-slate-500">
                The page you're looking for doesn't exist or may have been
                moved. Don't worry — you can head back to the homepage or
                continue browsing.
              </p>
              <div class="mt-8 flex flex-col gap-3 sm:flex-row">
                <a
                  href="#"
                  class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
                >
                  Go Home
                </a>
                <a
                  href="#"
                  class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
                >
                  Contact Support
                </a>
              </div>
              <div class="mt-8 flex items-center gap-2 text-sm text-slate-400">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 19l-7-7 7-7"
                  />
                </svg>
                Return to previous page
              </div>
            </div>
            <div class="relative flex items-center justify-center p-8 lg:p-12">
              <div
                class="absolute h-72 w-72 rounded-full bg-indigo-200/50 blur-3xl"
              ></div>

              <div class="relative">
                <svg viewBox="0 0 320 260" class="w-full max-w-sm">
                  <circle cx="52" cy="38" r="8" fill="#818CF8" opacity=".25" />
                  <circle cx="275" cy="55" r="6" fill="#6366F1" opacity=".35" />
                  <circle
                    cx="250"
                    cy="205"
                    r="10"
                    fill="#A5B4FC"
                    opacity=".3"
                  />
                  <rect
                    x="60"
                    y="35"
                    width="200"
                    height="170"
                    rx="24"
                    fill="#ffffff"
                    stroke="#E5E7EB"
                    stroke-width="2"
                  />
                  <rect
                    x="80"
                    y="55"
                    width="70"
                    height="10"
                    rx="5"
                    fill="#E0E7FF"
                  />
                  <circle cx="225" cy="60" r="5" fill="#FCA5A5" />
                  <text
                    x="160"
                    y="120"
                    text-anchor="middle"
                    font-size="44"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="700"
                    fill="#111827"
                  >
                    404
                  </text>
                  <rect
                    x="95"
                    y="138"
                    width="130"
                    height="8"
                    rx="4"
                    fill="#E5E7EB"
                  />
                  <rect
                    x="110"
                    y="154"
                    width="100"
                    height="8"
                    rx="4"
                    fill="#F1F5F9"
                  />
                  <rect
                    x="110"
                    y="175"
                    width="100"
                    height="22"
                    rx="11"
                    fill="#111827"
                  />
                  <text
                    x="160"
                    y="190"
                    text-anchor="middle"
                    font-size="9"
                    font-family="Arial, Helvetica, sans-serif"
                    font-weight="600"
                    fill="#ffffff"
                  >
                    HOME
                  </text>
                  <path
                    d="M20 220 C80 170, 120 250, 180 215 S280 180, 310 225"
                    fill="none"
                    stroke="#C7D2FE"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-dasharray="6 8"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
