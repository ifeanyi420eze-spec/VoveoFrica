<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1efc1e" />
    <title>Page not found | VOVEOFRICA</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/404.css') }}"
    />
  </head>
  <body>
    <main class="not-found-page">
      <section class="not-found-card">
        <div class="not-found-art" aria-hidden="true">
          <span class="not-found-heart">♡</span>
          <span class="not-found-spark">✦</span>
        </div>
        <div class="not-found-content">
          <p class="not-found-eyebrow">Looks like this connection got lost</p>
          <p class="not-found-code">404</p>
          <h1>We can’t find that page</h1>
          <p>
            The page may have moved or the link may be out of date. Let’s get you
            back to somewhere familiar.
          </p>
          <nav class="not-found-actions" aria-label="Page links">
            <a class="not-found-button not-found-button-primary" href="{{ url_for('root.home') }}">Go to homepage</a>
            <a class="not-found-button not-found-button-secondary" href="{{ url_for('root.contact') }}">Contact support</a>
          </nav>
        </div>
      </section>
    </main>
  </body>
</html>
