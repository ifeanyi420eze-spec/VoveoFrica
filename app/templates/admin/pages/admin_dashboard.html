<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin overview | VOVEOFRICA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <main class="admin-page">
        <nav class="admin-nav" aria-label="Admin navigation">
            <a class="brand" href="{{ url_for('admin.dashboard') }}">VOVEOFRICA <span>Admin</span></a>
            <div class="admin-links">
                <a href="{{ url_for('admin.dashboard') }}" aria-current="page">Overview</a><a href="{{ url_for('admin.users') }}">Members</a><a href="{{ url_for('admin.matches') }}">Matches</a><a href="{{ url_for('admin.reports') }}">Reports</a>
            </div>
        </nav>
        <header class="admin-header">
            <div>
                <p class="eyebrow">Community operations</p>
                <h1>Admin overview</h1>
                <p>A quick view of the VOVEOFRICA community.</p>
            </div>
        </header>
        <section class="stats-grid" aria-label="Community statistics">
            <article class="stat-card"><span>Registered members</span><strong>{{ user_count }}</strong></article>
            <article class="stat-card"><span>Connections made</span><strong>{{ match_count }}</strong></article>
            <article class="stat-card"><span>Reports to review</span><strong>{{ report_count }}</strong></article>
        </section>
        <div class="admin-shortcuts">
            <a class="btn btn-primary" href="{{ url_for('admin.users') }}">Manage members</a>
            <a class="btn btn-secondary" href="{{ url_for('admin.matches') }}">Review matches</a>
            <a class="btn btn-secondary" href="{{ url_for('admin.reports') }}">Review reports</a>
        </div>
    </main>
</body>
</html>
